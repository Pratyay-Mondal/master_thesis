[package]
name = "c2pa_wasm"
version = "0.1.0"
edition = "2021"
description = "Lightweight WebAssembly C2PA manifest validator for browser extensions"
authors = ["Pratyay Mondal <p.mondal@student.thws.de>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
c2pa = { version = "0.38.1", default-features = false, features = ["file_io", "add_thumbnails"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
