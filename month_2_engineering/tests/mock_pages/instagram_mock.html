<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram Feed Mock</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fafafa; padding: 20px; }
    main { max-width: 470px; margin: 0 auto; }
    article { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 24px; }
    header { padding: 12px; font-weight: bold; }
    ._aagv img { width: 100%; display: block; }
    .caption { padding: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <article>
      <header>
        <span>photographer_travel</span>
      </header>
      <div class="_aagv">
        <img src="https://picsum.photos/470/470?1" alt="IG Sample" width="470" height="470">
      </div>
      <div class="caption">
        <span class="_a9zs">Sunset over the European Alps. Taken with standard DSLR aperture f/2.8. #nature #photography</span>
      </div>
    </article>
  </main>
</body>
</html>
